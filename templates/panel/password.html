{% extends "panel/layout.html" %}
{% block ptitle %}Şifre{% endblock %}
{% block content %}
<a class="pn-back" href="{{ url_for('panel.settings') }}">← Ayarlar</a>
<h1>Şifre değiştir</h1>
<form method="post" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label class="fld"><span>Mevcut şifre</span><input type="password" name="old" autocomplete="current-password" required></label>
  <label class="fld"><span>Yeni şifre</span><input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
  <label class="fld"><span>Yeni şifre (tekrar)</span><input type="password" name="again" autocomplete="new-password" minlength="8" required></label>
  <button class="btn-primary" type="submit">Değiştir</button>
</form>
{% endblock %}
